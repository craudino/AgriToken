# services/oracle — A3. Adaptadores, quórum, cache, disputa e linhagem.
# Artefato congelado da Fase 0.
openapi: 3.1.0
info:
  title: CPR Digital — Oráculos com governança
  version: 1.0.0
  description: >
    P4 é a razão de ser deste serviço: nenhuma leitura contratual sai daqui
    com fonte única. Quando a redundância cai, a resposta é 503 com estado
    SEM_QUORUM — nunca um número plausível de origem única. Toda leitura
    carrega linhagem até o payload cru arquivado (P5, P6).
servers:
  - url: https://oracle.cpr.local/v1
security:
  - bearerAuth: []
    mtls: []
paths:
  /leituras:
    get:
      summary: Consulta leituras agregadas
      operationId: listarLeituras
      parameters:
        - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
        - { name: tipo, in: query, required: true, schema: { $ref: '#/components/schemas/TipoLeitura' } }
        - { name: chave, in: query, required: true, schema: { type: string } }
        - { name: em, in: query, schema: { type: string, format: date-time }, description: 'Leitura vigente no instante informado (reprodutibilidade, P6).' }
        - { name: estado, in: query, schema: { $ref: 'comum.yaml#/components/schemas/EstadoLeitura' } }
      responses:
        '200':
          description: Leituras
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Leitura' } }
  /leituras/efetiva:
    get:
      summary: Leitura vigente com efeito contratual
      description: >
        Contrato de fronteira com A2 e A4. Só devolve 200 quando a leitura está
        EFETIVA ou DEGRADADA; caso contrário 503, e o consumidor é proibido de
        prosseguir com a decisão contratual.
      operationId: obterLeituraEfetiva
      parameters:
        - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
        - { name: tipo, in: query, required: true, schema: { $ref: '#/components/schemas/TipoLeitura' } }
        - { name: chave, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Leitura com quórum
          content: { application/json: { schema: { $ref: '#/components/schemas/Leitura' } } }
        '503': { $ref: 'comum.yaml#/components/responses/SemQuorum' }
  /leituras/{id}/linhagem:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
    get:
      summary: De onde veio este número
      operationId: obterLinhagem
      responses:
        '200':
          description: Árvore de insumos da leitura
          content:
            application/json:
              schema:
                type: object
                required: [leitura_id, politica_aplicada, fontes, hash_linhagem]
                properties:
                  leitura_id: { type: string, format: uuid }
                  politica_aplicada: { $ref: '#/components/schemas/PoliticaQuorum' }
                  hash_linhagem: { $ref: 'comum.yaml#/components/schemas/Hash32' }
                  fontes: { type: array, items: { $ref: '#/components/schemas/LeituraFonte' } }
                  descartadas:
                    type: array
                    description: Fontes recebidas e descartadas, com o motivo. O que foi ignorado importa tanto quanto o que foi usado.
                    items: { $ref: '#/components/schemas/LeituraFonte' }
  /leituras/{id}/disputas:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
      - $ref: 'comum.yaml#/components/parameters/ChaveIdempotencia'
    post:
      summary: Contesta uma leitura
      description: >
        Abrir disputa suspende o efeito contratual da leitura imediatamente,
        sem apagá-la. Decisões já tomadas com base nela são reexaminadas pelo
        núcleo, não revertidas silenciosamente aqui.
      operationId: abrirDisputa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fundamento]
              properties:
                fundamento: { type: string, minLength: 20 }
                evidencia: { type: array, items: { $ref: 'comum.yaml#/components/schemas/Evidencia' } }
      responses:
        '201':
          description: Disputa aberta; leitura em EM_DISPUTA
          content: { application/json: { schema: { $ref: '#/components/schemas/Disputa' } } }
  /fontes:
    get:
      summary: Fontes cadastradas e sua saúde
      operationId: listarFontes
      parameters:
        - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
      responses:
        '200':
          description: Fontes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Fonte' } }
  /politicas:
    get:
      summary: Política de quórum por tipo de leitura
      operationId: listarPoliticas
      parameters:
        - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
      responses:
        '200':
          description: Políticas vigentes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PoliticaQuorum' } }
    put:
      summary: Atualiza política de quórum
      description: >
        Recusa qualquer política CONTRATUAL com menos de duas fontes
        independentes — a restrição existe também na base (P4).
      operationId: atualizarPolitica
      parameters:
        - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoliticaQuorum' }
      responses:
        '200':
          description: Política atualizada
          content: { application/json: { schema: { $ref: '#/components/schemas/PoliticaQuorum' } } }
        '422':
          description: Política violaria P4
          content: { application/problem+json: { schema: { $ref: 'comum.yaml#/components/schemas/Problema' } } }
  /saude/degradacao:
    get:
      summary: Estado de degradação do serviço
      description: Contrato de fronteira com A6 e com a observabilidade de A7.
      operationId: obterDegradacao
      parameters:
        - $ref: 'comum.yaml#/components/parameters/CorrelacaoId'
      responses:
        '200':
          description: Panorama por tipo de leitura
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [tipo, fontes_ativas, fontes_exigidas, degradado]
                  properties:
                    tipo: { $ref: '#/components/schemas/TipoLeitura' }
                    fontes_ativas: { type: integer }
                    fontes_exigidas: { type: integer }
                    degradado: { type: boolean }
                    desde: { type: [string, 'null'], format: date-time }
components:
  securitySchemes:
    bearerAuth: { $ref: 'comum.yaml#/components/securitySchemes/bearerAuth' }
    mtls: { $ref: 'comum.yaml#/components/securitySchemes/mtls' }
  schemas:
    TipoLeitura:
      type: string
      enum: [PRECO, GEOESPACIAL, FISCAL, CLIMATICO, PAGAMENTO, REGISTRO]
    Leitura:
      type: object
      required: [id, tipo, chave, estado, referencia_em, expira_em, fontes_usadas, fontes_independentes, hash_linhagem]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoLeitura' }
        chave: { type: string }
        valor_numerico: { type: [string, 'null'] }
        valor_json: {}
        unidade: { type: [string, 'null'] }
        estado: { $ref: 'comum.yaml#/components/schemas/EstadoLeitura' }
        referencia_em: { type: string, format: date-time }
        coletada_em: { type: string, format: date-time }
        expira_em: { type: string, format: date-time }
        fontes_usadas: { type: integer }
        fontes_independentes: { type: integer }
        dispersao_pct: { type: [number, 'null'] }
        hash_linhagem: { $ref: 'comum.yaml#/components/schemas/Hash32' }
    LeituraFonte:
      type: object
      required: [fonte, recebido_em, bruto_hash, bruto_uri]
      properties:
        fonte: { type: string }
        valor_numerico: { type: [string, 'null'] }
        valor_json: {}
        recebido_em: { type: string, format: date-time }
        latencia_ms: { type: [integer, 'null'] }
        bruto_hash: { $ref: 'comum.yaml#/components/schemas/Hash32' }
        bruto_uri: { type: string, format: uri }
        descartada: { type: boolean }
        motivo_descarte: { type: [string, 'null'] }
    Fonte:
      type: object
      required: [codigo, tipo, ativa, operador]
      properties:
        codigo: { type: string }
        tipo: { $ref: '#/components/schemas/TipoLeitura' }
        operador: { type: string }
        ativa: { type: boolean }
        peso: { type: number }
        independente_de: { type: array, items: { type: string } }
        ultima_coleta_em: { type: [string, 'null'], format: date-time }
        taxa_falha_24h_pct: { type: [number, 'null'] }
    PoliticaQuorum:
      type: object
      required: [tipo, criticidade, min_fontes, min_fontes_independentes, desvio_max_pct, janela_validade, agregacao]
      properties:
        tipo: { $ref: '#/components/schemas/TipoLeitura' }
        criticidade: { type: string, enum: [INFORMATIVA, CONTRATUAL] }
        min_fontes: { type: integer, minimum: 1 }
        min_fontes_independentes: { type: integer, minimum: 1 }
        desvio_max_pct: { type: number }
        janela_validade: { type: string, description: 'Duração ISO-8601, por exemplo PT36H.' }
        agregacao: { type: string, enum: [MEDIANA, MEDIA_PONDERADA, UNANIMIDADE, INTERSECAO] }
        permite_degradado: { type: boolean }
    Disputa:
      type: object
      required: [id, leitura_id, aberta_em, prazo_ate]
      properties:
        id: { type: string, format: uuid }
        leitura_id: { type: string, format: uuid }
        aberta_em: { type: string, format: date-time }
        prazo_ate: { type: string, format: date-time }
        resolucao: { type: [string, 'null'], enum: [MANTIDA, SUBSTITUIDA, INVALIDADA, null] }
